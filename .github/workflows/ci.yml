name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Lint
        run: corepack pnpm lint

  format:
    name: Format check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Format check
        run: corepack pnpm format:check

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Test
        run: corepack pnpm test

  e2e:
    name: E2E (Playwright)
    needs: [install, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Build production bundle
        # Required for playwright's `webServer` (`next start`) to find `.next/`.
        # Always builds — when VERCEL_PREVIEW_URL is set, the build still has
        # to succeed because the playwright config unconditionally declares
        # a webServer, and `next start` will fail without `.next/`.
        run: corepack pnpm build
      - name: Run Playwright against preview URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.VERCEL_PREVIEW_URL || 'http://localhost:3000' }}
        run: corepack pnpm test:e2e

  lighthouse:
    name: Lighthouse
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Soft-pass until VERCEL_PREVIEW_URL secret is wired. Without it the job
    # spawns a local production server and audits perf on a GH-hosted runner,
    # which is too noisy to gate merges on (perf scores routinely fluctuate
    # below the 90 threshold on shared runners). Once the preview URL is
    # configured, drop continue-on-error and the gate becomes hard again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Build production bundle (no preview URL secret)
        # Only needed when LIGHTHOUSE_SPAWN_SERVER mode is active.
        run: corepack pnpm build
      - name: Run Lighthouse
        env:
          LIGHTHOUSE_BASE_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
          LIGHTHOUSE_SPAWN_SERVER: ${{ secrets.VERCEL_PREVIEW_URL == '' && '1' || '' }}
        run: corepack pnpm lighthouse

  backstop-greps:
    name: Backstop greps
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: No *_cents columns with float types (ADR-0004)
        run: |
          # Excludes tests/ (regex-pattern fixtures) and node_modules/ (third-party).
          if grep -rEi '[a-zA-Z_]+_cents\s+(decimal|numeric|float|real|double\s+precision)\b' --include='*.sql' --include='*.ts' --exclude-dir=tests --exclude-dir=tests-e2e --exclude-dir=node_modules --exclude-dir=.next .; then
            echo "::error::Found *_cents column with floating-point type; money must be INTEGER per ADR-0004"
            exit 1
          fi
      - name: No service-role key in client trees (ADR-0007)
        run: |
          if grep -rE 'SUPABASE_SERVICE_ROLE_KEY' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' 'app/(member)/' 'app/(marketing)/' 'components/' 2>/dev/null; then
            echo "::error::Service-role key referenced in client trees; per ADR-0007 it is server-only"
            exit 1
          fi
      - name: PostHog imports only inside lib/analytics (ADR-0028)
        run: |
          # Catches stray `posthog-js` imports that would bypass the consent gate.
          # The lib/analytics/ module owns all PostHog SDK access.
          if grep -rE "from\\s+['\"]posthog(-js|-node)?['\"]" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=lib/analytics --exclude-dir=tests/analytics .; then
            echo "::error::PostHog imported outside lib/analytics/. Route through lib/analytics so the consent gate applies."
            exit 1
          fi

  # ADR-0018: migration safety gate. Scans new/modified migrations for risky
  # patterns (DROP without ack, ALTER TYPE, blocking CREATE INDEX, *_cents
  # non-INTEGER, SET NOT NULL without backfill comment) and validates the
  # filename convention. The actual `supabase db push` against staging is
  # deferred until a staging Supabase project is provisioned (escalation:
  # SUPABASE_ACCESS_TOKEN secret + project ref).
  migrations:
    name: Migrations safety + naming
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so the scanner can diff PR head against the base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Run scanner self-test
        run: node scripts/check-migration-safety.mjs --self-test
      - name: Scan changed migrations against base
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migration-safety.mjs --against-base
      - name: Scan all migrations on main push
        if: github.event_name == 'push'
        run: node scripts/check-migration-safety.mjs

  # Migration deploy hook — kept as a placeholder until a staging Supabase
  # project is provisioned. When SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF
  # are configured, this becomes `supabase db push` against staging.
  migrate-staging:
    name: Migrate staging (placeholder — pending Supabase staging project)
    needs: [typecheck, lint, test, migrations]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Migration step placeholder
        run: |
          echo "Migration step pending Supabase staging project provisioning."
          echo "Set SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF secrets and"
          echo "this job becomes 'supabase db push' against staging."
          exit 0
