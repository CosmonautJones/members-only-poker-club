name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Lint
        run: corepack pnpm lint

  format:
    name: Format check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Format check
        run: corepack pnpm format:check

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Test
        run: corepack pnpm test

  e2e:
    name: E2E (Playwright)
    needs: [install, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run Playwright against preview URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.VERCEL_PREVIEW_URL || 'http://localhost:3000' }}
        run: corepack pnpm test:e2e

  lighthouse:
    name: Lighthouse
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Run Lighthouse
        env:
          LIGHTHOUSE_BASE_URL: ${{ secrets.VERCEL_PREVIEW_URL || 'http://localhost:3000' }}
        run: corepack pnpm lighthouse

  backstop-greps:
    name: Backstop greps
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: No *_cents columns with float types (ADR-0004)
        run: |
          if grep -rEi '[a-zA-Z_]+_cents\s+(decimal|numeric|float|real|double\s+precision)\b' --include='*.sql' --include='*.ts' .; then
            echo "::error::Found *_cents column with floating-point type; money must be INTEGER per ADR-0004"
            exit 1
          fi
      - name: No service-role key in client trees (ADR-0007)
        run: |
          if grep -rE 'SUPABASE_SERVICE_ROLE_KEY' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' 'app/(member)/' 'app/(marketing)/' 'components/' 2>/dev/null; then
            echo "::error::Service-role key referenced in client trees; per ADR-0007 it is server-only"
            exit 1
          fi

  # Migration deploy hook — full implementation depends on ADR-0018 ratifying.
  # When ADR-0018 lands, this job runs `supabase db push` against the target
  # project before traffic swap, gates production on staging-migration success,
  # and rolls back on failure.
  migrate-staging:
    name: Migrate staging (placeholder — pending ADR-0018)
    needs: [typecheck, lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Migration step placeholder
        run: |
          echo "Migration step pending ADR-0018 ratification."
          echo "When 0018 lands, this becomes 'supabase db push' against staging."
          exit 0
